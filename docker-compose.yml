services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      # Used by the healthcheck's sqlcmd so the password is not on its command line.
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "127.0.0.1:1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # One-shot: runs db/*.sql in name order, then exits.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD}
      READER_PASSWORD: ${READER_PASSWORD:?set READER_PASSWORD in .env}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/bash", "-c"]
    # -b: stop with a non-zero exit code on error. -I: QUOTED_IDENTIFIER ON.
    # $$ keeps compose from interpolating; bash expands them inside the container.
    command:
      - |
        for f in /db/*.sql; do
          echo "Running $$f"
          /opt/mssql-tools18/bin/sqlcmd -S db -U sa -C -b -I -v READER_PASSWORD="$$READER_PASSWORD" -i "$$f" || exit 1
        done
